<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pick'em War Room</title>
<style>
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --ink:#1B1F24; --muted:#67707A; --line:#E8E6E2;
  --green:#15803D; --green-soft:#E9F4EC; --rust:#B45309; --rust-soft:#FBEFE2;
  --amber:#A16207; --amber-soft:#FDF3D8; --blue:#1D4ED8; --blue-soft:#E8EEFC;
  --skip:#9AA1A9; --win:#15803D; --loss:#B3403A; --shadow:0 1px 2px rgba(20,24,28,.05),0 4px 16px rgba(20,24,28,.04);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131519; --surface:#1B1E24; --ink:#E8EAED; --muted:#9AA3AD; --line:#2A2E35;
  --green:#2EA366; --green-soft:#1B2B22; --rust:#D98324; --rust-soft:#2E2419;
  --amber:#D9A62E; --amber-soft:#2D2716; --blue:#7BA0F5; --blue-soft:#1C2333;
  --skip:#6C737B; --win:#2EA366; --loss:#D96A5F; --shadow:none;
}}
:root[data-theme="light"]{
  --bg:#FAFAF9; --surface:#FFFFFF; --ink:#1B1F24; --muted:#67707A; --line:#E8E6E2;
  --green:#15803D; --green-soft:#E9F4EC; --rust:#B45309; --rust-soft:#FBEFE2;
  --amber:#A16207; --amber-soft:#FDF3D8; --blue:#1D4ED8; --blue-soft:#E8EEFC;
  --skip:#9AA1A9; --win:#15803D; --loss:#B3403A; --shadow:0 1px 2px rgba(20,24,28,.05),0 4px 16px rgba(20,24,28,.04);
}
:root[data-theme="dark"]{
  --bg:#131519; --surface:#1B1E24; --ink:#E8EAED; --muted:#9AA3AD; --line:#2A2E35;
  --green:#2EA366; --green-soft:#1B2B22; --rust:#D98324; --rust-soft:#2E2419;
  --amber:#D9A62E; --amber-soft:#2D2716; --blue:#7BA0F5; --blue-soft:#1C2333;
  --skip:#6C737B; --win:#2EA366; --loss:#D96A5F; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:840px;margin:0 auto;padding:28px 20px 64px}
header h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
nav{display:flex;gap:22px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:18px 0 0}
.ptab{font-size:14px;font-weight:600;padding:8px 2px;color:var(--muted);text-decoration:none;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.ptab.active{color:var(--ink);border-bottom-color:var(--ink)}
.ptab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wkbar{display:flex;gap:5px;flex-wrap:wrap;margin:14px 0 4px}
.wkbar .lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  align-self:center;margin-right:4px}
.wk{min-width:32px;text-align:center;font-size:12px;font-weight:600;padding:4px 7px;border-radius:7px;
  border:1px solid var(--line);color:var(--muted);text-decoration:none;font-variant-numeric:tabular-nums}
.wk.posr{background:var(--green-soft);border-color:transparent;color:var(--green)}
.wk.negr{background:var(--rust-soft);border-color:transparent;color:var(--rust)}
.wk.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.tile-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile-num{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.tile-num .g{color:var(--green)} .tile-num .r{color:var(--loss)}
.tile-sub{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.panel h3{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.wkstrip{display:flex;gap:6px;flex-wrap:wrap}
.wkchip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums}
.wkchip small{color:var(--muted);font-weight:500}
.wkchip.pos{border-color:var(--green);}
.wkchip.neg{border-color:color-mix(in srgb,var(--loss) 45%,var(--line));}
.wkchip:hover{background:var(--bg)}
.news{margin:0;padding-left:18px}
.news li{margin:7px 0;font-size:13.5px;color:var(--muted)}
.news li b{color:var(--ink)}
.games{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.card.skip{opacity:.62}
.head{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;user-select:none}
.head:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.rank{width:24px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;text-align:right;flex:none}
.matchup{flex:1;min-width:0}
.teams{font-weight:600;font-size:15px}
.lines{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.chip{font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip-conf{background:var(--amber-soft);color:var(--amber)}
.chip-pick{background:var(--green-soft);color:var(--green)}
.chip-skip{background:transparent;color:var(--skip);border:1px solid var(--line)}
.chip-move{background:var(--blue-soft);color:var(--blue)}
.chip-qb{background:var(--rust-soft);color:var(--rust)}
.chip-win{background:var(--green-soft);color:var(--win)}
.chip-loss{background:var(--rust-soft);color:var(--loss)}
.pickbox{text-align:right;flex:none;min-width:86px}
.pickteam{font-weight:650;font-size:15px}
.pct{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.detail{display:none;border-top:1px solid var(--line);padding:16px;background:color-mix(in srgb,var(--surface) 60%,var(--bg))}
.card.open .detail{display:block}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:22px}
@media(max-width:640px){
  .cols{grid-template-columns:1fr}
  .head{flex-wrap:wrap;row-gap:6px}
  .rank{width:20px}
  .matchup{flex:1 1 0;min-width:0}
  .teams{font-size:14px}
  .lines{white-space:normal}
  .pickbox{min-width:76px}
  .chips{flex-basis:100%;justify-content:flex-start;margin-left:32px}
  .tile-num{font-size:20px}
  .frow{grid-template-columns:110px 1fr 40px}
}
.btwrap{overflow-x:auto}
.btwrap .inner{min-width:540px}
h4{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:6px}
.frow{display:grid;grid-template-columns:150px 1fr 44px;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px}
.fname{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftrack{position:relative;height:14px}
.ftrack::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.fbar{position:absolute;top:3px;height:8px;border-radius:4px}
.fbar.pos{left:50%;background:var(--green)}
.fbar.neg{right:50%;background:var(--rust)}
.fval{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.mathline{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.mathline b{color:var(--ink);font-variant-numeric:tabular-nums}
.inj-team{font-weight:600;font-size:13px;margin:8px 0 4px}
.inj{font-size:12.5px;color:var(--muted);margin:2px 0}
.inj .st-Out{color:var(--loss);font-weight:600}
.inj .st-Doubtful{color:var(--rust);font-weight:600}
.inj .st-Questionable{color:var(--amber);font-weight:600}
.inj-qb{font-weight:650;color:var(--ink)}
.none{font-size:12.5px;color:var(--muted);font-style:italic}
.btrow{display:grid;grid-template-columns:52px 1fr 60px 84px 64px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums;margin-bottom:6px}
.btrow.hdr{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bttrack{position:relative;height:14px}
.bttrack::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.btbar{position:absolute;top:3px;height:8px;border-radius:4px}
.btbar.pos{left:50%;background:var(--green)}
.btbar.neg{right:50%;background:var(--rust)}
.btpct{text-align:right}
.btrec,.btconf{text-align:right;color:var(--muted)}
.btrow.cur{font-weight:650}
.chart-note{font-size:12px;color:var(--muted);margin-top:8px}
svg text{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:var(--muted)}
.footer-notes{margin-top:30px;border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--muted)}
.footer-notes p{margin:6px 0;max-width:64ch}
.narr-toggle{margin-top:14px;font-size:12.5px;font-weight:600;color:var(--blue);cursor:pointer;
  background:none;border:none;padding:0;font-family:inherit}
.narr-toggle:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.narr{display:none;margin-top:10px;padding:12px 14px;border-left:3px solid var(--line);
  font-size:13.5px;color:var(--muted);max-width:66ch}
.narr.open{display:block}
.narr p{margin:0 0 10px}
.narr p:last-child{margin-bottom:0}
</style>

function trajChart(weekly){
  const W=640,H=150,mL=34,mR=46,mT=10,mB=24;
  const xs=weekly.map(d=>d.week), ys=weekly.map(d=>d.cum_margin);
  const ymin=Math.min(0,...ys)-1, ymax=Math.max(0,...ys)+1;
  const X=w=>mL+(w-xs[0])/(xs[xs.length-1]-xs[0])*(W-mL-mR);
  const Y=v=>mT+(ymax-v)/(ymax-ymin)*(H-mT-mB);
  let s='';
  const pts=weekly.map(d=>`${X(d.week).toFixed(1)},${Y(d.cum_margin).toFixed(1)}`).join(' ');
  const grid=[...new Set([0,5,10,15].filter(v=>v<=ymax))];
  grid.forEach(v=>{s+=`<line x1="${mL}" x2="${W-mR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1" ${v===0?'stroke-dasharray="0"':'stroke-dasharray="2 4"'}/>`;
    s+=`<text x="${mL-6}" y="${Y(v)+3}" text-anchor="end">${v>0?'+':''}${v}</text>`;});
  s+=`<polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="2"/>`;
  weekly.forEach(d=>{s+=`<circle cx="${X(d.week)}" cy="${Y(d.cum_margin)}" r="3.2" fill="var(--green)"><title>Week ${d.week}: ${d.wins}-${d.losses} (running ${d.cum_margin>0?'+':''}${d.cum_margin})</title></circle>`;});
  const last=weekly[weekly.length-1];
  s+=`<text x="${X(last.week)+8}" y="${Y(last.cum_margin)+4}" style="fill:var(--green);font-weight:600">${last.cum_margin>0?'+':''}${last.cum_margin}</text>`;
  weekly.filter((d,i)=>i%3===0||i===weekly.length-1).forEach(d=>{s+=`<text x="${X(d.week)}" y="${H-6}" text-anchor="middle">W${d.week}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Cumulative wins above .500 by week">${s}</svg>`;
}

    const bars=g.factors.map(f=>{
      const wd=Math.min(50,Math.abs(f.pp)/MAX*50), cls=f.pp>=0?'pos':'neg';
      return `<div class="frow"><div class="fname">${f.name}</div><div class="ftrack"><div class="fbar ${cls}" style="width:${wd}%"></div></div><div class="fval">${f.pp>0?'+':''}${f.pp.toFixed(1)}</div></div>`;}).join('');
    const injHTML=[g.away,g.home].map(t=>{
      const list=g.injuries[t]||[];
      if(!list.length) return `<div class="inj-team">${t}</div><div class="none">no listed injuries</div>`;
      return `<div class="inj-team">${t}</div>`+list.map(x=>`<div class="inj ${x.pos==='QB'?'inj-qb':''}">${x.pos} ${x.name} <span class="st-${x.status}">${x.status}</span>${x.detail?' &middot; '+x.detail:''}</div>`).join('');}).join('');
    html+=`<div class="card ${g.status==='skip'?'skip':''}" id="card-${gi}">
    <div class="head" tabindex="0" role="button" aria-expanded="false" data-i="${gi}">
      <div class="rank">${g.rank}</div>
      <div class="matchup"><div class="teams">${g.away} @ ${g.home} ${g.agree?'':'<span style="color:var(--rust);font-size:11px;font-weight:600">models split</span>'}</div>
      <div class="lines">pool: ${fav}${closeTxt}</div></div>
      <div class="chips">${chips.join('')}</div>
      <div class="pickbox"><div class="pickteam">${g.pick} ${pickLine(g)}</div><div class="pct">${g.p_final.toFixed(1)}%</div></div>
    </div>
    <div class="detail"><div class="cols">
      <div><h4>Why &mdash; probability points toward the pick</h4>
        <div class="axis"><span>&larr; against ${g.pick}</span><span>for ${g.pick} &rarr;</span></div>${bars}
        <div class="mathline">model alone <b>${g.p_model.toFixed(1)}%</b> &middot; line-move edge <b>${g.p_value.toFixed(1)}%</b> &middot; combined <b>${g.p_final.toFixed(1)}%</b></div>
        ${g.narrative&&g.narrative.length?`<button class="narr-toggle" data-narr="${gi}">Full analysis &darr;</button>
        <div class="narr" id="narr-${gi}">${g.narrative.map(p=>'<p>'+p+'</p>').join('')}</div>`:''}</div>
      <div><h4>Injury report</h4>${injHTML}</div>
    </div></div></div>`;
  });
  html+='</div>';
  view.innerHTML=html;
  view.querySelectorAll('.narr-toggle').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();
      const n=document.getElementById('narr-'+b.dataset.narr);
      n.classList.toggle('open');
      b.innerHTML='Full analysis '+(n.classList.contains('open')?'&uarr;':'&darr;');});});
  view.querySelectorAll('.head').forEach(h=>{
    const t=()=>{const c=h.parentElement;c.classList.toggle('open');h.setAttribute('aria-expanded',c.classList.contains('open'));};
    h.addEventListener('click',t);
    h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t();}});});
  foot.innerHTML=`<p><b>%</b> blends the two rating models with market movement off the pool line. Expand a game for the factor bars; <b>Line move vs pool</b> is the market edge, everything else is the model. Skips are usually model disagreements or coin flips.</p>`;
}

function renderSeasons(){
  let rows=`<div class="btrow hdr" style="grid-template-columns:64px 90px 54px 70px 84px 96px 1fr"><div>Season</div><div>Record</div><div>%</div><div>Points</div><div>Line-move</div><div>Best / worst</div><div></div></div>`;
  seasonKeys.slice().reverse().forEach(k=>{
    const st = ALL[k].stats;
    const pos = st.win_pct>50;
    rows+=`<div class="btrow" style="grid-template-columns:64px 90px 54px 70px 84px 96px 1fr;cursor:pointer" onclick="location.hash='${k}/home'">
      <div style="font-weight:650">${k}</div>
      <div>${st.record}</div>
      <div style="color:${pos?'var(--green)':'var(--loss)'}">${st.win_pct}%</div>
      <div style="color:var(--muted)">${st.pts_won||0}/${st.pts_staked||0}</div>
      <div style="color:var(--muted)">${st.move_record}</div>
      <div style="color:var(--muted)">${st.best_week?st.best_week[1]:'-'} / ${st.worst_week?st.worst_week[1]:'-'}</div>
      <div style="color:var(--muted);font-size:12px">${st.note||''}</div></div>`;
  });
  view.innerHTML=`<div class="panel"><h3>Season history &mdash; engine record by year</h3><div class="btwrap"><div class="inner" style="min-width:640px">${rows}</div></div>
  <div class="chart-note">Click a season to open it. New seasons appear here automatically. For the model's 15-year validation, see the Backtest tab.</div></div>`;
  foot.innerHTML='';
}

function renderBacktest(){
  const tw=BT.reduce((a,x)=>a+x.w,0), tl=BT.reduce((a,x)=>a+x.l,0);
  const cw=BT.reduce((a,x)=>a+x.cw,0), cl=BT.reduce((a,x)=>a+x.cl,0);
  const tp=BT.reduce((a,x)=>a+(x.pts||0),0), tps=BT.reduce((a,x)=>a+(x.pts_staked||0),0);
  const winning=BT.filter(x=>x.pct>50).length;
  const span=9;  // percentage points from 50 to edge of bar
  let rows=`<div class="btrow hdr" style="grid-template-columns:52px 1fr 60px 84px 64px 64px"><div>Season</div><div style="text-align:center">ATS win % (centered on 50%)</div><div class="btpct">%</div><div class="btrec">Record</div><div class="btconf">Conf</div><div class="btconf">Pts %</div></div>`;
  BT.forEach(x=>{
    const d=x.pct-50, wd=Math.min(50,Math.abs(d)/span*50), cls=d>=0?'pos':'neg';
    rows+=`<div class="btrow ${x.season===2025?'cur':''}" style="grid-template-columns:52px 1fr 60px 84px 64px 64px"><div>${x.season}</div>
      <div class="bttrack"><div class="btbar ${cls}" style="width:${wd}%"></div></div>
      <div class="btpct" style="color:${d>=0?'var(--green)':'var(--loss)'}">${x.pct.toFixed(1)}</div>
      <div class="btrec">${x.w}-${x.l}${x.p?'-'+x.p:''}</div><div class="btconf">${x.cw}-${x.cl}</div>
      <div class="btconf" style="color:${x.pts_pct>=50?'var(--green)':'var(--loss)'}">${x.pts_pct!=null?x.pts_pct.toFixed(1):'-'}</div></div>`;
  });
  view.innerHTML=`
  <div class="tiles">
    <div class="tile"><div class="tile-label">15-season record</div><div class="tile-num">${tw}-${tl}</div><div class="tile-sub">${(100*tw/(tw+tl)).toFixed(1)}% of picks, 2011&ndash;2025</div></div>
    <div class="tile"><div class="tile-label">Confidence picks</div><div class="tile-num">${cw}-${cl}</div><div class="tile-sub">${(100*cw/(cw+cl)).toFixed(1)}%</div></div>
    <div class="tile"><div class="tile-label">Winning seasons</div><div class="tile-num">${winning}<span style="font-size:14px;color:var(--muted)"> / ${BT.length}</span></div><div class="tile-sub">above .500</div></div>
    <div class="tile"><div class="tile-label">Points race</div><div class="tile-num">${tps?(100*tp/tps).toFixed(1)+'%':'-'}</div><div class="tile-sub">4-4-2 staking banked, incl. playoffs (field ~50%)</div></div>
  </div>
  <div class="panel"><h3>Walk-forward backtest by season &mdash; 10 picks/week, no lookahead</h3><div class="btwrap"><div class="inner">${rows}</div></div>
  <div class="chart-note">Every season predicted using only data available before each game. Pts % = share of staked points banked with 4-4-2 staking on the top-3 confidence picks, regular season + playoffs (WC/DIV/CON+SB weeks). Regular-season staking banks 54.8%; playoff staking runs below 50% &mdash; in January, stake by line value, not model confidence. No line-move edge included (pool lines only exist for 2025) &mdash; live results should run slightly better. The spread between 45.7% and 58.8% seasons is what a real edge looks like: variance is the price of admission.</div></div>`;
  foot.innerHTML='';
}

function route(){
  let h=(location.hash||'').slice(1);
  if(!h) h = curSeason + '/home';
  if(h!=='backtest' && h!=='seasons'){
    const parts = h.split('/');
    if(ALL[parts[0]]) loadSeason(parts[0]);
    h = parts[0] + '/' + (parts[1]||'home');
  }
  document.getElementById('subtitle').textContent =
    (h==='backtest'?'Model validation, 2011-2025':h==='seasons'?'Engine record by year':curSeason+' season \u00b7 updated Sep 27, 2026');
  nav.innerHTML=navHTML(h);
  document.getElementById('wkbar').innerHTML=wkbarHTML(h);
  if(h==='backtest') renderBacktest();
  else if(h==='seasons') renderSeasons();
  else{
    const sub = h.split('/')[1];
    if(sub && sub.startsWith('w')) renderWeek(Number(sub.slice(1)));
    else renderHome();
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
